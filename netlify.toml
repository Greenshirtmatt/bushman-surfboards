# netlify.toml — Bushman Surfboards static site
# This site is plain HTML/CSS/JS. No build step required.

[build]
  publish = "."
  command = ""

# Clean URLs: /about instead of /about.html (Netlify also does this automatically,
# but declaring it makes intent explicit).
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/press"
  to = "/press.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Redirect legacy Shopify paths so old inbound links don't 404.
[[redirects]]
  from = "/pages/about"
  to = "/about"
  status = 301
[[redirects]]
  from = "/pages/press"
  to = "/press"
  status = 301
[[redirects]]
  from = "/pages/contact"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
[[redirects]]
  from = "/account"
  to = "/"
  status = 301

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
